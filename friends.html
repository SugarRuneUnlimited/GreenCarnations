function copyToClipboard(buttonId) {
    const htmlMap = {

    };

    const textToCopy = htmlMap[buttonId];
    
    navigator.clipboard.writeText(textToCopy).then(() => {
        alert("Copied to clipboard! XD");
    }).catch(err => {
        console.error("Uh oh, failed to copy: ", err);
    });
}
